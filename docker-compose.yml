
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: sudoku
      POSTGRES_PASSWORD: sudoku
      POSTGRES_DB: quantum_sudoku
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sudoku -d quantum_sudoku"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
